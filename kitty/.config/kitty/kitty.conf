# ~/.config/kitty/kitty.conf

# Shell
shell /usr/sbin/fish
login_shell yes

# Font
font_family JetBrainsMono Nerd Font
font_size 12

# Farger
background #1E1E2E
#background 282a36dd
foreground #CDD6F4
selection_background #575268
selection_foreground #1E1E2E
cursor #F5E0DC

# Oppførsel

enabled_layouts splits, stack, tall, grid
enable_audio_bell no
confirm_os_window_close 0
background_opacity 0.95
window_padding_width 0
scrollback_lines 5000
allow_remote_control yes
listen_on unix:@kitty

# Tastatursnarveier
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+h previous_tab
map ctrl+shift+l toggle_layout stack
map ctrl+shift+a focus_visible_window
map ctrl+shift+n next_layout
#map ctrl+left  neighboring_window left
#map ctrl+right neighboring_window right
#map ctrl+up    neighboring_window up
map ctrl+tab    next_window
map ctrl+shift+tab previous_window

map ctrl+down  neighboring_window down

map ctrl+up detach_window ask
term xterm-256color



# ── Statuslinje (tab bar som path-viser) ──

# Vis tab bar alltid, selv med bare 1 tab
tab_bar_min_tabs 1

# Plasser den nederst (som nvim) eller øverst
tab_bar_edge bottom

# Vis current working directory i tab-tittelen
tab_title_template "📂 {tab.active_wd}"

# Stil – velg det du foretrekker
tab_bar_style separator
tab_separator ""

# Farger for statuslinja
active_tab_foreground   #cdd6f4
active_tab_background   #313244
active_tab_font_style   normal
inactive_tab_foreground #6c7086
inactive_tab_background #1e1e2e




